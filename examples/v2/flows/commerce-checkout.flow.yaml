schemaVersion: "2.1"
appId: commerce
flowId: checkout
title: Checkout Flow
entryScreen: cart
deepLinks:
  - route: /checkout/cart
    targetScreen: cart
  - route: /checkout/payment
    targetScreen: payment
screens:
  - id: cart
    path: examples/v2/screens/checkout-cart.screen.yaml
    role: entry
  - id: payment
    path: examples/v2/screens/checkout-payment.screen.yaml
    role: step
transitions:
  - from: cart
    event: continue
    to: payment
    effect: warm_payment_form
  - from: payment
    event: back
    to: cart
